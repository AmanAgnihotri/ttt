version: "2"
run:
  concurrency: 4
  issues-exit-code: 2
  tests: true
output:
  path-prefix: ""
linters:
  default: all
  disable:
    - containedctx
    - gochecknoglobals
    - gochecknoinits
    - ireturn
    - embeddedstructfieldcheck
    - noinlineerr
    - exhaustruct
    - gomodguard
    - wsl
  settings:
    cyclop:
      max-complexity: 9
      package-average: 6
    depguard:
      rules:
        api:
          list-mode: lax
          files:
            - '**/api/**'
          deny:
            - pkg: github.com/lesismal/nbio
              desc: not allowed
            - pkg: go.mongodb.org/mongo-driver
              desc: not allowed
        data:
          list-mode: lax
          files:
            - '**/infra/data/**'
          deny:
            - pkg: github.com/lesismal/nbio
              desc: not allowed
            - pkg: github.com/golang-jwt/jwt/v5
              desc: not allowed
        domain:
          list-mode: lax
          files:
            - '**/domain/**'
          deny:
            - pkg: github.com/lesismal/nbio
              desc: not allowed
            - pkg: go.mongodb.org/mongo-driver
              desc: not allowed
            - pkg: github.com/golang-jwt/jwt/v5
              desc: not allowed
        main:
          list-mode: lax
          files:
            - $all
          allow:
            - $gostd
          deny:
            - pkg: io/ioutil
              desc: replaced by io and os packages since Go 1.16
            - pkg: reflect
              desc: not allowed
        web:
          list-mode: lax
          files:
            - '**/infra/web/**'
          deny:
            - pkg: github.com/golang-jwt/jwt/v5
              desc: not allowed
            - pkg: go.mongodb.org/mongo-driver
              desc: not allowed
    exhaustive:
      check:
        - switch
        - map
      default-signifies-exhaustive: true
    exhaustruct_v5:
      ignore-patterns:
        - .+/nbhttp\.Config
    predeclared:
      ignore:
        - delete
      qualified-name: true
    varnamelen:
      ignore-names:
        - ok
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - cyclop
        path: (.+)_test\.go
      - linters:
          - gosec
        path: (.+)_test\.go
        text: G101
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(ttt)
        - blank
        - dot
        - alias
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
